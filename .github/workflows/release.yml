name: Release
on:
  push:
    tags:
    - v*
  workflow_dispatch:
    inputs:
      version:
        description: Release version (e.g., 1.2.0) — only used in workflow_dispatch mode
        required: false
        type: string
jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '26'
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Build
      run: npm run build
    - name: Test
      run: npm test
  publish:
    name: Publish to npm
    needs: build-test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      EVENT_NAME: ${{ github.event_name }}
      DISPATCH_VERSION: ${{ inputs.version }}
      RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '26'
        registry-url: https://registry.npmjs.org
    - name: Resolve release version
      run: |
        if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
          VERSION="$DISPATCH_VERSION"
        elif [ "$EVENT_NAME" = "push" ] && [[ "$RELEASE_TAG" == v* ]]; then
          VERSION="${RELEASE_TAG#v}"
        else
          echo "::error::Unsupported release event or tag prefix"
          exit 1
        fi
        if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
          echo "::error::Release version must be a stable x.y.z version"
          exit 1
        fi
        PACKAGE_VERSION="$(node -p "require('./package.json').version")"
        if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
          echo "::error::Release version must match the committed package.json version"
          exit 1
        fi
    - name: Install dependencies
      run: npm ci
    - name: Build
      run: npm run build
    - name: Test
      run: npm test
    - name: Publish to npm
      run: npm publish --access public --provenance=false
